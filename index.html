<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Medicina</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <h1>Quiz de Medicina</h1>
        <div class="quiz-header">
            <div class="quiz-info">
                <span class="question-counter">Pergunta 1/10</span>
                <span class="score">Pontuação: 0</span>
            </div>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
        </div>
        <div class="question-container">
            <h2 class="question">Carregando pergunta...</h2>
            <div class="options-container"></div>
        </div>
        <button class="next-btn">Próxima</button>
        <div class="result-container hidden">
            <h2>Resultado Final</h2>
            <p class="final-score">Você acertou 0 de 10 perguntas</p>
            <p class="final-message"></p>
            <button class="restart-btn">Reiniciar Quiz</button>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
